<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Linefire</title>
<style>
/* Ebitengine sizes its canvas from the window, so it owns a whole document. The
   project page embeds this in an iframe; on a phone it is played directly, full
   screen. touch-action/overscroll are disabled so the two thumb sticks never
   scroll, zoom or rubber-band the page mid-fight. */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #06080c;
  color: #e6e8ec;
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  touch-action: none;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
/* touch-action is NOT inherited, and Ebitengine's canvas arrives without it: on iOS
   every 120Hz touchmove then pays synchronous gesture arbitration on the main thread
   — exactly the "two thumbs = jank" report. The rule must sit on the canvas itself. */
canvas {
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
#loader {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .75rem;
  text-align: center;
  padding: 1rem;
  background: #0a0e14;
  z-index: 10;
}
#loader.done { display: none; }
#logo {
  color: #70e0ff;
  font-weight: 700;
  letter-spacing: .35em;
  font-size: 1.1rem;
  text-shadow: 0 0 12px rgba(112, 224, 255, .55);
}
#bar {
  width: min(260px, 70%);
  height: 3px;
  background: #1b2430;
  border-radius: 2px;
  overflow: hidden;
}
#bar::after {
  content: "";
  display: block;
  width: 40%;
  height: 100%;
  background: #70e0ff;
  animation: slide 1.1s ease-in-out infinite;
}
@keyframes slide {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}
#status { color: #9aa3af; font-size: .9rem; margin: 0; }
#status b { color: #e6e8ec; font-weight: 600; font-variant-numeric: tabular-nums; }
#hint { color: #6b7280; font-size: .8rem; margin: 0; }
</style>
</head>
<body>
<div id="loader">
  <div id="logo">L I N E F I R E</div>
  <div id="bar"></div>
  <p id="status">Loading the game<b></b></p>
  <p id="hint">About 10 MB to download. Tap or press a key to start once it boots.</p>
</div>

<script src="wasm_exec.js"></script>
<script>
(function () {
  const loader = document.getElementById("loader");
  const status = document.getElementById("status");
  const hint = document.getElementById("hint");
  const counter = status.querySelector("b");

  // A long-press on a thumb stick must never open the browser context menu.
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  function fail(message) {
    document.getElementById("bar").remove();
    status.textContent = message;
    hint.textContent = "";
  }

  if (typeof WebAssembly !== "object") {
    fail("This browser has no WebAssembly support, so the game cannot run here.");
    return;
  }

  // The counter reports decoded megabytes rather than a percentage: GitHub Pages
  // gzips the module, so Content-Length is the compressed size while the stream
  // read here is already decompressed — a percentage would sail past 100.
  function withProgress(response) {
    if (!response.body || typeof ReadableStream !== "function") {
      return response;
    }
    let loaded = 0;
    const stream = new ReadableStream({
      start(controller) {
        const reader = response.body.getReader();
        function pump() {
          return reader.read().then(({ done, value }) => {
            if (done) {
              controller.close();
              return;
            }
            loaded += value.byteLength;
            counter.textContent = " — " + (loaded / 1048576).toFixed(1) + " MB";
            controller.enqueue(value);
            return pump();
          });
        }
        return pump().catch((err) => controller.error(err));
      },
    });
    return new Response(stream, { headers: response.headers });
  }

  async function boot() {
    const response = await fetch("linefire.wasm");
    if (!response.ok) {
      throw new Error("HTTP " + response.status + " fetching linefire.wasm");
    }
    const go = new Go();
    const result = await WebAssembly.instantiateStreaming(withProgress(response), go.importObject);

    // Ebitengine appends its canvas on start; the loader stays up until it
    // exists, so the page never uncovers to an empty black screen.
    const observer = new MutationObserver(() => {
      const canvas = document.body.querySelector("canvas");
      if (!canvas) {
        return;
      }
      observer.disconnect();
      loader.classList.add("done");
    });
    observer.observe(document.body, { childList: true });

    go.run(result.instance);
  }

  boot().catch((err) => {
    console.error(err);
    fail("The game failed to load. Reloading the page usually fixes it.");
  });
})();
</script>
</body>
</html>
