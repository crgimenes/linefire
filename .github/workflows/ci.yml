name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  # Native per-OS test pass — the real gate: cross-compiling proves a build,
  # never a run.
  #
  # NO CGO, on any platform, Linux included. Ebitengine is pure Go there on the
  # v2.10 alpha this project pins — which is exactly why it pins that alpha.
  # Setting it at the job level is the enforcement: a dependency that quietly
  # needed a C toolchain fails here instead of on somebody's machine.
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # The tests build worlds and assets but never open a window (no RunGame/Draw),
      # so they run headless. -timeout + timeout-minutes fail a wedged test fast with
      # a goroutine dump instead of hanging to go test's 10m default.
      - name: Test
        timeout-minutes: 10
        run: go test -timeout 120s -count 1 ./...

  # Compile-check every target the release ships, plus the web build. Nothing
  # here needs cgo, which is what lets one host cross-compile the whole matrix
  # and why the release is a local script (the shared ./release.sh) rather than
  # a workflow with a runner per platform. js/wasm builds only the
  # game: the editors need OS dialogs and subprocesses with no browser
  # equivalent.
  cross-build:
    name: cross-build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64, pkg: "./..." }
          - { goos: darwin, goarch: arm64, pkg: "./..." }
          - { goos: windows, goarch: amd64, pkg: "./..." }
          - { goos: linux, goarch: amd64, pkg: "./..." }
          - { goos: linux, goarch: arm64, pkg: "./..." }
          - { goos: js, goarch: wasm, pkg: "./cmd/linefire" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" ${{ matrix.pkg }}

  lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Install golangci-lint
        # v2.13.0 is the first release bundling staticcheck v0.8.0-rc.1, which
        # understands Go 1.27's promoted-field keys in composite literals. Older
        # staticcheck panics building the IR for the linux internal/poll source.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0
      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...
